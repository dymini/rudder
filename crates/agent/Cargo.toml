[package]
name = "dymini-panel-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Dymini Panel node agent"

[[bin]]
name = "dymini-panel-agent"
path = "src/main.rs"

[dependencies]
dymini-panel-core = { path = "../core" }
dymini-panel-node = { path = "../node" }
dymini-panel-proto = { path = "../proto" }
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bytes = "1.12.1"
futures-util = "0.3.34"
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
tonic = { version = "0.14.5", features = ["tls-aws-lc"] }
sha2 = "0.11.2"
hex = "0.4.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3.27.0"
