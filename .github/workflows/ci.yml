name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dymini-panel
          POSTGRES_PASSWORD: dymini-panel
          POSTGRES_DB: dymini-panel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dymini-panel -d dymini-panel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        env:
          DATABASE_URL: postgres://dymini-panel:dymini-panel@localhost:5432/dymini-panel
        run: cargo test --workspace

      - name: OpenAPI document is current
        run: cargo run -q -p dymini-panel-server -- openapi | diff -u web/openapi.json -

      - name: Install scripts parse
        run: for f in deploy/*.sh deploy/release/*.sh; do sh -n "$f"; done

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install and build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  changelog:
    name: changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Changes that people can see are in CHANGELOG.md
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "refs/remotes/origin/$BASE_REF...HEAD")
          if printf '%s\n' "$changed" | grep -Eq '^(crates|web/src|deploy|templates)/'; then
            if ! printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md'; then
              echo "::error::this pull request changes code but not CHANGELOG.md; add a line under [Unreleased] that says what users will notice"
              exit 1
            fi
          fi

  # The docs published to https://developers.dymini.com/panel (developers.yml): broken links, missing pages and
  # unsupported MDX fail here. Pull requests from branches of this repository also get a preview at
  # https://developers.dymini.com/_preview/panel/pr-<number> for 14 days; forks only build (no OIDC token).
  docs:
    name: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build the docs
        run: npx --yes https://cdn.dymini.com/lib/dymini-docs@1.0.1/dymini-docs.tgz build --strict

      - name: Preview the docs of this pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR: ${{ github.event.number }}
        run: npx --yes https://cdn.dymini.com/lib/dymini-docs@1.0.1/dymini-docs.tgz preview --pr "$PR"
