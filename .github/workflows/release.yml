name: Release

# Builds static musl binaries for x86_64 and aarch64, multi-arch panel and cache
# images, and a GitHub release whose SHA256SUMS is signed with minisign, then
# publishes the docs of the tag to developers.dymini.com.
#
# Repository settings this workflow needs:
#   - variable DYMINI_PANEL_UPDATE_PUBKEY: the minisign public key (base64 line), compiled
#     into the panel so it can verify releases.
#   - secret MINISIGN_SECRET_KEY: the matching secret key file contents, created
#     with `minisign -G -W` (no password; the secret store protects it).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: CHANGELOG.md describes this release
        run: |
          # The panel shows these notes to everyone before they update.
          if ! sh deploy/release/changelog.sh "${GITHUB_REF_NAME#v}" >/dev/null; then
            echo "::error::add a [${GITHUB_REF_NAME#v}] section to CHANGELOG.md (rename [Unreleased]) before tagging"
            exit 1
          fi

      - name: Signing configuration is present
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          DYMINI_PANEL_UPDATE_PUBKEY: ${{ vars.DYMINI_PANEL_UPDATE_PUBKEY }}
        run: |
          missing=""
          [ -n "$MINISIGN_SECRET_KEY" ] || missing="$missing secret:MINISIGN_SECRET_KEY"
          [ -n "$DYMINI_PANEL_UPDATE_PUBKEY" ] || missing="$missing variable:DYMINI_PANEL_UPDATE_PUBKEY"
          if [ -n "$missing" ]; then
            echo "::error::set these repository settings before tagging a release:$missing"
            exit 1
          fi

  binaries:
    name: binaries (${{ matrix.target }})
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build the web UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        run: |
          pip install ziglang==0.15.2
          cargo install cargo-zigbuild --locked --version 0.23.4

      - name: Build
        env:
          DYMINI_PANEL_UPDATE_PUBKEY: ${{ vars.DYMINI_PANEL_UPDATE_PUBKEY }}
        run: |
          export DYMINI_PANEL_BUILD_VERSION="${GITHUB_REF_NAME#v}"
          cargo zigbuild --release --target ${{ matrix.target }} \
            -p dymini-panel-server -p dymini-panel-cache -p dymini-panel-agent -p dymini-panel-cli

      - name: Stage
        run: |
          out=out/${{ matrix.arch }}
          mkdir -p "$out"
          for bin in dymini-panel-server dymini-panel-cache dymini-panel-agent dymini-panel; do
            cp "target/${{ matrix.target }}/release/$bin" "$out/$bin-${{ matrix.target }}"
          done
          "$out/dymini-panel-agent-${{ matrix.target }}" --version || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.arch }}
          path: out/${{ matrix.arch }}

  images:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      panel: ${{ steps.panel.outputs.digest }}
      cache: ${{ steps.cache.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bin-*
          path: bin
          merge-multiple: true

      - name: Lay out dist/ for the Dockerfiles
        run: |
          mkdir -p dist/agents
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-musl; do
            arch=${pair%%:*}
            target=${pair#*:}
            install -m 0755 "bin/dymini-panel-server-$target" "dist/dymini-panel-server-$arch"
            install -m 0755 "bin/dymini-panel-cache-$target" "dist/dymini-panel-cache-$arch"
            install -m 0755 "bin/dymini-panel-agent-$target" "dist/agents/dymini-panel-agent-$target"
            (cd dist/agents && sha256sum "dymini-panel-agent-$target" > "dymini-panel-agent-$target.sha256")
          done

      - name: Image names
        id: names
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          version="${GITHUB_REF_NAME#v}"
          echo "panel=ghcr.io/$owner/panel" >> "$GITHUB_OUTPUT"
          echo "cache=ghcr.io/$owner/panel-cache" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "latest=false" >> "$GITHUB_OUTPUT" ;; *) echo "latest=true" >> "$GITHUB_OUTPUT" ;; esac

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Panel image
        id: panel
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/panel.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.panel }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.latest == 'true' && format('{0}:latest', steps.names.outputs.panel) || '' }}

      - name: Cache image
        id: cache
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/cache.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.cache }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.latest == 'true' && format('{0}:latest', steps.names.outputs.cache) || '' }}

  cli-binaries:
    name: cli-binaries (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: dymini-panel-aarch64-apple-darwin
            bin: dymini-panel
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: dymini-panel-x86_64-apple-darwin
            bin: dymini-panel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: dymini-panel-x86_64-pc-windows-msvc.exe
            bin: dymini-panel.exe
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        shell: bash
        env:
          DYMINI_PANEL_UPDATE_PUBKEY: ${{ vars.DYMINI_PANEL_UPDATE_PUBKEY }}
        run: |
          export DYMINI_PANEL_BUILD_VERSION="${GITHUB_REF_NAME#v}"
          cargo build --release --target ${{ matrix.target }} -p dymini-panel-cli
          mkdir -p out-cli
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "out-cli/${{ matrix.asset }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-cli-${{ matrix.target }}
          path: out-cli/${{ matrix.asset }}

  release:
    needs: [binaries, cli-binaries, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true

      - name: Write release.json and SHA256SUMS
        env:
          PANEL_DIGEST: ${{ needs.images.outputs.panel }}
          CACHE_DIGEST: ${{ needs.images.outputs.cache }}
          DYMINI_PANEL_UPDATE_PUBKEY: ${{ vars.DYMINI_PANEL_UPDATE_PUBKEY }}
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/agents
          mv dist/dymini-panel-agent-* dist/agents/
          cp deploy/install.sh deploy/install-agent.sh deploy/install-cli.sh deploy/install-cli.ps1 dist/
          python3 - <<'PY'
          import os
          from pathlib import Path
          key = os.environ["DYMINI_PANEL_UPDATE_PUBKEY"]
          for name in ("install.sh", "install-agent.sh"):
              path = Path("dist") / name
              text = path.read_text()
              if "__DYMINI_PANEL_UPDATE_PUBKEY__" not in text:
                  raise SystemExit(f"{name} is missing the signing-key placeholder")
              path.write_text(text.replace("__DYMINI_PANEL_UPDATE_PUBKEY__", key))
          PY
          sh deploy/release/make-release.sh "$version" dist \
            "ghcr.io/$owner/panel:$version@$PANEL_DIGEST" \
            "ghcr.io/$owner/panel-cache:$version@$CACHE_DIGEST"
          rm -rf dist/agents
          cat dist/release.json

      - name: Sign SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          DYMINI_PANEL_UPDATE_PUBKEY: ${{ vars.DYMINI_PANEL_UPDATE_PUBKEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/dymini-panel.key"
          minisign -S -s "$RUNNER_TEMP/dymini-panel.key" -m dist/SHA256SUMS -t "dymini-panel ${GITHUB_REF_NAME#v}"
          rm -f "$RUNNER_TEMP/dymini-panel.key"
          minisign -V -P "$DYMINI_PANEL_UPDATE_PUBKEY" -m dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          sh deploy/release/changelog.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --title "Dymini Panel $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" $flags

  # Publishes the guides of this tag to https://developers.dymini.com/panel (developers.yml). Runs after the
  # release so a failed release never shows docs for a version nobody can install. Authenticates with the
  # GitHub OIDC token of this run; developers.dymini.com accepts it only for dymini/panel and this tag.
  docs:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Publish the docs of this version
        run: npx --yes https://cdn.dymini.com/lib/dymini-docs@1.0.1/dymini-docs.tgz publish
