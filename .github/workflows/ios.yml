name: iOS app

# Builds the Rudder iOS companion app (Expo, in `app/`) on a macOS runner.
# Two artifacts:
#   - a simulator build (always unsigned, proves the app compiles and links), and
#   - an unsigned device `.xcarchive`/IPA when the signing secrets are absent.
#
# To produce a signed, installable IPA, add these repository secrets and the
# workflow signs with them automatically:
#   - IOS_BUILD_CERTIFICATE_BASE64: base64 of a .p12 distribution certificate
#   - IOS_P12_PASSWORD: the .p12 password
#   - IOS_PROVISION_PROFILE_BASE64: base64 of the .mobileprovision file
#   - IOS_TEAM_ID: the Apple Developer team id

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS app
    runs-on: macos-latest
    env:
      IOS_CERT: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      IOS_TEAM: ${{ secrets.IOS_TEAM_ID }}
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          bunx expo lint
          bunx tsc --noEmit

      - name: Generate the native iOS project
        run: bunx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build for the iOS Simulator
        run: |
          cd ios
          xcodebuild \
            -workspace Rudder.xcworkspace \
            -scheme Rudder \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: rudder-simulator-app
          path: app/ios/build-sim/Build/Products/Debug-iphonesimulator/*.app
          retention-days: 14

      - name: Import signing certificate
        if: ${{ env.IOS_CERT != '' && env.IOS_PROFILE != '' && env.IOS_TEAM != '' }}
        run: |
          echo "$IOS_CERT" | base64 --decode > /tmp/dist.p12
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security import /tmp/dist.p12 -k ci.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci ci.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Archive unsigned device build
        if: ${{ !(env.IOS_CERT != '' && env.IOS_PROFILE != '' && env.IOS_TEAM != '') }}
        run: |
          cd ios
          xcodebuild \
            -workspace Rudder.xcworkspace \
            -scheme Rudder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/rudder \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Archive signed device build
        if: ${{ env.IOS_CERT != '' && env.IOS_PROFILE != '' && env.IOS_TEAM != '' }}
        run: |
          cd ios
          xcodebuild \
            -workspace Rudder.xcworkspace \
            -scheme Rudder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/rudder \
            archive

      - name: Export signed IPA
        if: ${{ env.IOS_CERT != '' && env.IOS_PROFILE != '' && env.IOS_TEAM != '' }}
        run: |
          cd ios
          cat > export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>$IOS_TEAM</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/rudder.xcarchive -exportPath build/ipa -exportOptionsPlist export.plist

      - name: Upload device archive
        uses: actions/upload-artifact@v4
        with:
          name: rudder-device-build
          path: |
            app/ios/build/rudder.xcarchive
            app/ios/build/ipa/*.ipa
          retention-days: 14
        if: ${{ always() && hashFiles('app/ios/build') != '' }}

  testflight:
    name: Upload to TestFlight
    runs-on: macos-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check App Store Connect secrets
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "::notice::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64 secrets are missing; skipping TestFlight upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        id: secrets

      - name: Install dependencies
        if: steps.secrets.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Generate the native iOS project
        if: steps.secrets.outputs.skip != 'true'
        run: bunx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        if: steps.secrets.outputs.skip != 'true'
        run: |
          cd ios
          pod install

      - name: Install fastlane
        if: steps.secrets.outputs.skip != 'true'
        run: sudo gem install fastlane --no-document

      - name: Build, sign and upload to TestFlight
        if: steps.secrets.outputs.skip != 'true'
        run: fastlane ios beta
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_TIMESTAMP: "1"

      - name: Upload signed IPA
        if: steps.secrets.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rudder-testflight-ipa
          path: app/ios/build/Rudder.ipa
          retention-days: 30
